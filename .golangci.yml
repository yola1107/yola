version: "2"
run:
  modules-download-mode: readonly
linters:
  default: none
  # Uber Go Style Guide 的行长为软限制，不使用 lll 硬性报错。
  enable:
    - bodyclose
    - dogsled
    - durationcheck
    - errcheck
    - gocognit
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - loggercheck
    - misspell
    - mnd
    - nilnesserr
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    - whitespace
  settings:
    gocognit:
      min-complexity: 35
    gocyclo:
      min-complexity: 20
    govet:
      enable:
        - shadow
    misspell:
      locale: US
    mnd:
      checks:
        - case
        - condition
        - return
    nolintlint:
      require-explanation: true
      require-specific: true
    whitespace:
      # gofumpt 会移除函数体开头的空行。
      multi-func: false
  exclusions:
    generated: lax
    warn-unused: true
    presets:
      - comments
      - std-error-handling
    rules:
      - linters:
          - gocognit
          - goconst
        path: (.+)_test\.go
issues:
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - prefix(yola)
        - default
      custom-order: true
    gofumpt:
      # 两个 module 共用 yola 前缀，避免项目导入被识别为标准库。
      module-path: yola
  exclusions:
    generated: lax
