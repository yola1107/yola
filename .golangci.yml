version: "2"
run:
  modules-download-mode: readonly
linters:
  default: none
  # 沿用 Uber 的软行长限制；不按行数、参数数量或名称长度机械拆分代码。
  enable:
    - bodyclose
    - dogsled
    - durationcheck
    - errcheck
    - errname # 哨兵错误使用 Err 前缀，错误类型使用 Error 后缀。
    - errorlint # 检查错误包装、比较和类型断言。
    - gocognit
    - goconst
    - gocritic # 仅启用默认稳定规则，不启用全部或实验性规则。
    - gocyclo
    - govet
    - ineffassign
    - loggercheck
    - misspell
    - mnd
    - nilnesserr
    - nolintlint
    - predeclared # 避免遮蔽 len、error 等预声明标识符。
    - revive
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    - whitespace
  settings:
    gocognit:
      min-complexity: 35
    gocyclo:
      min-complexity: 20
    govet:
      enable:
        - shadow
    misspell:
      locale: US
    mnd:
      checks:
        - case
        - condition
        - return
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      # 自定义规则时保留默认命名、接收者和导出名称检查。
      enable-default-rules: true
      rules:
        - name: confusing-naming
        - name: early-return
          arguments:
            - preserve-scope
        - name: superfluous-else
          arguments:
            - preserve-scope
    whitespace:
      # gofumpt 会移除函数体开头的空行。
      multi-func: false
  exclusions:
    generated: lax
    warn-unused: true
    presets:
      - comments
      - std-error-handling
    rules:
      - linters:
          - gocognit
          - goconst
        path: (.+)_test\.go
issues:
  # 完整输出告警，避免每个检查器默认只显示前 50 条。
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - prefix(yola)
        - default
      custom-order: true
    gofumpt:
      # 两个 module 共用 yola 前缀，避免项目导入被识别为标准库。
      module-path: yola
  exclusions:
    generated: lax
