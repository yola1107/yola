# 基于 golang-lint 技能提供的 assets/.golangci.yml 模板。
# 已使用 golangci-lint v2.15.0 验证。
version: "2"

run:
  concurrency: 4
  timeout: 5m                      # 分析超时时间。
  tests: true                      # 将测试文件纳入检查。
  modules-download-mode: readonly  # 检查时以只读模式处理共享 module 的依赖。

issues:
  max-issues-per-linter: 0  # 不限制单个 linter 的告警数量
  max-same-issues: 0        # 不限制相同文本的告警数量
  uniq-by-line: false       # 保留同一行的不同诊断

output:
  show-stats: true          # 输出总数与各 linter 的告警数量

linters:
  # 显式列出启用项，避免工具升级改变默认检查集合。
  default: none
  enable:
    # 正确性与错误处理
    - govet                 # 检查锁复制、格式字符串、结构体标签和不可达代码等问题
    - staticcheck           # 综合静态分析：弃用 API、常见错误及可简化的代码
    - unused                # 检查未使用的变量、函数和类型
    - errcheck              # 检查未处理的错误返回值
    - errorlint             # 检查 errors.Is/As 和 %w 错误包装的用法（Go 1.13+）
    - nilerr                # 检查发现非 nil 错误后却返回 nil 的情况
    - nilnesserr            # 检查误用已知为 nil 的 error 值

    # 安全与资源管理
    - gosec                 # 检查 SQL 注入、硬编码凭据、弱加密和路径穿越等问题
    - sqlclosecheck         # 检查未关闭的 sql.Rows 和 sql.Stmt
    - rowserrcheck          # 检查遍历结束后是否处理 sql.Rows.Err()
    - bidichk               # 检查危险的 Unicode 双向控制字符（CVE-2021-42574）
    - bodyclose             # 检查未关闭的 HTTP 响应体，避免连接泄漏
    - fatcontext            # 检查循环内不断派生 Context 导致的链条增长和内存泄漏

    # 复杂度与重复代码
    - gocyclo               # 检查函数圈复杂度
    - gocognit              # 检查嵌套与控制流带来的认知复杂度
    - nestif                # 检查过深的 if/else 嵌套
    # - funlen              # 限制函数行数和语句数
    - dupl                  # 检查重复代码

    # 风格与命名
#     - revive              # 按项目约定审阅文档注释和代码风格
#     - funcorder           # 检查构造函数位于类型声明之后、方法之前
#     - whitespace          # 检查多余空白和空行
    - nolintlint            # 检查无效或不规范的抑制指令
    - misspell              # 检查标识符和注释中的常见英文拼写错误
    - predeclared           # 检查遮蔽 Go 内置标识符的命名，如 len、cap、error
#    - errname               # 检查错误变量和类型的命名，如 ErrFoo、FooError

    # 性能与简化
    - unconvert             # 检查多余的类型转换
    - ineffassign           # 检查赋值后未被读取的变量
    - wastedassign          # 检查未使用或使用前被覆盖的赋值
    - prealloc              # 检查简单循环中可预分配容量的切片
    - perfsprint            # 提示可替代 fmt.Sprintf 的更高效写法
    - mnd                   # 检查 case 分支和条件判断中的魔法数字
#    - goconst               # 检查可提取为常量的重复字面量

#    # 测试
#    - testifylint           # 检查 testify 的常见使用问题
#    - thelper               # 检查测试辅助函数是否调用 t.Helper()
#    - usetesting            # 提示在测试中使用 t.Setenv/t.TempDir 等测试专用方法
#    - paralleltest          # 检查已有并行测试的清理方式，不强制并行

  exclusions:
    generated: strict
    paths:
      - (^|/)(vendor|third_party)/

  settings:
    dupl:
      threshold: 100               # 重复片段的最少语法树节点数
    # funlen:
    #   lines: 120
    #   statements: 80
    goconst:
      min-len: 3
      min-occurrences: 4
      ignore-tests: true           # 测试样例可就地写明输入和期望值
    gocognit:
      min-complexity: 15           # 关注阅读负担，与圈复杂度互补
    gocyclo:
      min-complexity: 15           # 数值越小，对复杂度的限制越严格
    govet:
      enable:
        - shadow
    mnd:
      checks:
        - case
        - condition
        # - return                 # 评分等分支可直接返回数值
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofumpt               # 包含 gofmt 规则，并追加更严格的格式约束
    - goimports             # 整理导入：补充缺失项，移除未使用项
    - gci                   # 按标准库、项目包、第三方包分组，组间留空行
  settings:
    gci:
      # 严格按以下顺序分组，各组内部按导入路径排序。
      custom-order: true
      sections:
        - standard          # Go 标准库
        - prefix(yola)      # 根目录与 test/ 两个 module 的项目包
        - default           # 第三方包
    gofumpt:
      module-path: yola
      extra:
        group-params: true
        clothe-returns: true
  exclusions:
    generated: strict
    paths:
      - (^|/)(vendor|third_party)/
